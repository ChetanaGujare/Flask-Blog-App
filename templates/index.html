{% extends 'base.html' %}

{% block content %}
    <h1 class="page-title">Latest Posts</h1>
    
    <div class="post-list">
        <!-- Jinja2 Loop to render all posts -->
        {% for post in posts %}
            <article class="post-card">
                <h2 class="post-title">
                    <a href="{{ url_for('post_detail', post_id=post.id) }}">{{ post.title }}</a>
                </h2>
                <p class="post-meta">By {{ post.author }}</p>
                <p class="post-excerpt">{{ post.content[:100] }}...</p>
                <a href="{{ url_for('post_detail', post_id=post.id) }}" class="read-more">Read More &rarr;</a>
            </article>
        {% else %}
            <p>No posts available.</p>
        {% endfor %}
    </div>
{% endblock %}
